<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUNE Cold — Procedural Lunar</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&family=Pixelify+Sans:wght@400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#050A14;color:#fff;overflow:hidden}
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;width:calc(100% - 32px);max-width:1160px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;background:rgba(5,10,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);padding:10px 14px;display:flex;gap:8px;align-items:center}
.logo i{width:14px;height:14px;background:#8BA4C2;clip-path:polygon(50% 0,100% 70%,50% 100%,0 70%)}
.links{display:flex;gap:2px;background:rgba(5,10,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);padding:4px}
.links a{font-family:'Geist Mono',monospace;font-size:11px;padding:8px 14px;color:rgba(255,255,255,.45)}
.links a.on{background:rgba(255,255,255,.06);color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:flex-end;padding:0 24px 80px;max-width:1160px;margin:0 auto;width:100%}
.pixel{font-family:'Pixelify Sans',monospace;font-size:clamp(32px,5vw,54px);line-height:.95;text-transform:uppercase;color:#E8EEF5}
.sub{font-size:15px;font-weight:300;color:rgba(232,238,245,.55);max-width:520px;margin-top:16px;line-height:1.6}
.btn{font-family:'Geist Mono',monospace;font-size:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#E8EEF5;padding:10px 18px;margin-top:20px;display:inline-block}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:2;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid rgba(255,255,255,.06);background:rgba(5,10,20,.35);backdrop-filter:blur(8px)}
.bar span{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);text-align:center;padding:14px 6px;border-right:1px solid rgba(255,255,255,.05)}
</style>
</head>
<body>
<nav><div class="logo"><i></i> LIMITLESS LABS</div><div class="links"><a href="e-dune-hot.html">Hot →</a><a class="on">Cold Lunar</a><a href="e-dune.html">Static</a></div></nav>
<canvas id="c"></canvas>
<div class="hero">
<div>
<div class="pixel">I STUDY THE<br>SKY. I BUILD<br>THE TOOLS.</div>
<div class="sub">Procedural lunar — cratered dunes + starfield + cold twilight. No image, just math.</div>
<a class="btn" href="#log">Read the log →</a>
</div>
</div>
<div class="bar"><span>◈ ESA</span><span>RUST</span><span>LINUX</span><span>GITHUB</span><span>27 SATS</span><span>PWA</span><span>DEBIAN</span></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d')
let w,h,t=0,mx=0
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
addEventListener('resize',resize);resize()
addEventListener('mousemove',e=>mx=(e.clientX/w-.5)*0.6)
function n(x,y){return Math.sin(x*1.1)*Math.cos(y*.9)*.5+Math.sin(x*.4+y*1.2)*.3+Math.cos(x*1.7-y*.6)*.15}
function fbm(x,y){let v=0,a=.5,f=1;for(let i=0;i<5;i++){v+=a*n(x*f,y*f);a*=.5;f*=1.9}return v}
// stars
let stars=[]
for(let i=0;i<260;i++) stars.push({x:Math.random(),y:Math.random()*.55,s:Math.random()*1.2+.2,a:Math.random()*.7+.3,tw:Math.random()*6})
function draw(){
 t+=0.006
 x.clearRect(0,0,w,h)
 // sky cold gradient
 let g=x.createLinearGradient(0,0,0,h)
 g.addColorStop(0,'#020610');g.addColorStop(0.35,'#070F1F');g.addColorStop(0.55,'#0F1F33');g.addColorStop(0.68,'#1A2F4A');g.addColorStop(1,'#2A3F5E')
 x.fillStyle=g;x.fillRect(0,0,w,h)
 // stars
 stars.forEach(s=>{
  let tw=.7+Math.sin(t*0.8+s.tw)*.3
  x.fillStyle=`rgba(200,220,255,${s.a*tw})`
  x.fillRect(s.x*w, s.y*h, s.s, s.s)
 })
 // earth glow horizon faint
 let eg=x.createRadialGradient(w*.78,h*.35,10,w*.78,h*.35,420)
 eg.addColorStop(0,'rgba(140,170,210,.18)');eg.addColorStop(0.4,'rgba(80,110,160,.08)');eg.addColorStop(1,'transparent')
 x.fillStyle=eg;x.fillRect(0,0,w,h)
 // lunar dunes layers - colder, more cratered
 const layers=[
  {y:0.64, amp:70, col:'#0F1A26', off:0},
  {y:0.71, amp:48, col:'#162435', off:2},
  {y:0.77, amp:36, col:'#1E3248', off:4},
  {y:0.84, amp:22, col:'#2A435E', off:6},
 ]
 layers.forEach((L,i)=>{
  x.beginPath();x.moveTo(0,h)
  for(let px=0;px<=w;px+=3){
   let nx=px/w*3.2 + t*0.12 + L.off + mx*(i+1)*0.25
   let ny=fbm(nx,i*1.9)*L.amp
   // add crater dips
   let cr=Math.sin(px/w*18 + i)*Math.cos(px/w*7)*6 * (i>1?1:0)
   let py=h*L.y + ny - cr - Math.pow(Math.abs(px-w/2)/(w/2),1.4)*22
   if(px===0) x.lineTo(px,py); else x.lineTo(px,py)
  }
  x.lineTo(w,h);x.closePath()
  x.fillStyle=L.col;x.fill()
  // cold edge highlight
  x.strokeStyle='rgba(180,200,220,.07)';x.lineWidth=1;x.stroke()
 })
 // subtle fog
 x.fillStyle='rgba(10,20,35,.25)';x.fillRect(0,h*0.68,w,h*0.18)
 // grain cold
 x.fillStyle='rgba(255,255,255,.015)'
 for(let i=0;i<120;i++){x.fillRect(Math.random()*w,Math.random()*h,1,1)}
 requestAnimationFrame(draw)
}
draw()
</script>
</body>
</html>
