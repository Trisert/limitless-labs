<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Realistic Dunes</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&family=Pixelify+Sans:wght@400&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0F14;color:#fff;overflow:hidden;font-family:'Inter',sans-serif}
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;width:calc(100% - 32px);max-width:1160px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;background:rgba(10,15,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);padding:10px 14px}
.links{display:flex;gap:2px;background:rgba(10,15,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);padding:4px}
.links a{font-family:'Geist Mono',monospace;font-size:11px;padding:8px 14px;color:rgba(255,255,255,.5)}
.links a.on{background:rgba(255,255,255,.08);color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:flex-end;padding:0 24px 80px;max-width:1160px;margin:0 auto}
.pixel{font-family:'Pixelify Sans',monospace;font-size:clamp(32px,5vw,54px);line-height:.95;text-transform:uppercase}
.sub{font-weight:300;color:rgba(255,255,255,.6);margin-top:14px;max-width:520px;font-size:14px}
</style>
</head>
<body>
<nav><div class="logo">LIMITLESS — HOT REALISTIC</div><div class="links"><a class="on">Hot Real</a><a href="e-dune-cold-real.html">Cold Real →</a><a href="e-dune-hot.html">Flat Hot</a></div></nav>
<canvas id="c"></canvas>
<div class="hero"><div><div class="pixel">I STUDY THE<br>SKY. I BUILD<br>THE TOOLS.</div><div class="sub">Realistic procedural — fBm warped + sun shading. No flat layers.</div></div></div>
<script>
const canvas=document.getElementById('c'),gl=canvas.getContext('webgl')
if(!gl){document.body.innerHTML='WebGL not supported'}
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`
const fs=`
precision highp float;
uniform vec2 r;
uniform float t;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
 vec2 i=floor(p),f=fract(p);
 float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
 vec2 u=f*f*(3.-2.*f);
 return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm(vec2 p){
 float v=0.,a=.5;
 for(int i=0;i<5;i++){v+=a*noise(p);p*=2.;a*=.5;}
 return v;
}
float domainWarp(vec2 p){
 vec2 q=vec2(fbm(p+vec2(0,0)),fbm(p+vec2(5.2,1.3)));
 vec2 r=vec2(fbm(p+4.*q+vec2(1.7,9.2)),fbm(p+4.*q+vec2(8.3,2.8)));
 return fbm(p+4.*r);
}
void main(){
 vec2 uv=gl_FragCoord.xy/r;
 vec2 p=uv*2.-1.;p.x*=r.x/r.y;
 // sky
 vec3 sky=mix(vec3(0.04,0.08,0.12),vec3(0.12,0.16,0.2), uv.y*0.6+0.2);
 sky=mix(sky, vec3(0.85,0.55,0.28), smoothstep(0.45,0.75, uv.y)*0.9);
 // sun
 float sun=smoothstep(0.015,0.0,length(uv-vec2(0.72,0.68)));
 sky+=vec3(1.,0.86,0.6)*sun*0.9;
 sky+=vec3(1.,0.7,0.3)*pow(sun,0.3)*0.25;
 // dunes height - realistic warped
 float time=t*0.04;
 vec2 duneCoord=vec2(uv.x*3.2+time*0.15, uv.y*1.2);
 float h=domainWarp(duneCoord*2.5)*0.55 + domainWarp(duneCoord*6.)*0.18;
 h+=fbm(vec2(uv.x*22., uv.y*2.))*0.015; // micro ripples
 float horizon=0.58;
 float duneMask=smoothstep(horizon, horizon+0.02, uv.y + h*0.25);
 // base sand color realistic
 vec3 sandLow=vec3(0.78,0.66,0.52);
 vec3 sandHigh=vec3(0.92,0.82,0.68);
 vec3 sandMid=vec3(0.85,0.74,0.6);
 // height based color
 float heightFactor=smoothstep(0.2,0.6,h);
 vec3 sand=mix(sandLow, sandMid, heightFactor);
 sand=mix(sand, sandHigh, smoothstep(0.5,0.8,h)*0.6);
 // lighting - sun from upper right
 vec2 eps=vec2(0.008,0);
 float hL=domainWarp((duneCoord+eps)*2.5)*0.55;
 float hR=domainWarp((duneCoord-eps)*2.5)*0.55;
 float slope=(hR-hL)/0.016;
 float light=max(0., dot(normalize(vec3(-slope,1.,0.)), normalize(vec3(0.6,1.,0.3))));
 light=0.45+0.55*light;
 // shadow on leeward
 float shadow=smoothstep(-0.1,0.15,slope);
 light*=0.75+0.25*shadow;
 // self shadow for ripples
 float ripple=fbm(vec2(uv.x*80., uv.y*4.));
 light+=ripple*0.015;
 sand*=light;
 // darker in valleys
 sand*=0.92+0.08*smoothstep(0.3,0.7,h);
 // final mix sky vs dunes
 vec3 col=mix(sky, sand, duneMask);
 // fog/haze near horizon
 float fog=smoothstep(0.5,0.68, uv.y)*0.18*(1.-duneMask*0.5);
 col=mix(col, vec3(0.85,0.7,0.5), fog);
 // vignette
 float vig=1.-dot(uv-0.5,uv-0.5)*0.25;
 col*=vig;
 // grain
 float grain=hash(gl_FragCoord.xy*0.5+t*0.1)*0.04-0.02;
 col+=grain;
 gl_FragColor=vec4(col,1.);
}
`
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.log(gl.getShaderInfoLog(s));return s}
let v=sh(gl.VERTEX_SHADER,vs),f=sh(gl.FRAGMENT_SHADER,fs),pr=gl.createProgram()
gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);gl.useProgram(pr)
let buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW)
let loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,0,0,0)
let rL=gl.getUniformLocation(pr,'r'),tL=gl.getUniformLocation(pr,'t')
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',resize);resize()
let start=performance.now()
function loop(){
 let now=(performance.now()-start)/1000
 gl.uniform2f(rL,canvas.width,canvas.height);gl.uniform1f(tL,now)
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(loop)
}
loop()
</script>
</body>
</html>
