<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Realistic Dunes</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&family=Pixelify+Sans:wght@400&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0F14;color:#fff;overflow:hidden;font-family:'Inter',sans-serif}
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;width:calc(100% - 32px);max-width:1160px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;background:rgba(10,15,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);padding:10px 14px}
.links{display:flex;gap:2px;background:rgba(10,15,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);padding:4px}
.links a{font-family:'Geist Mono',monospace;font-size:11px;padding:8px 14px;color:rgba(255,255,255,.5)}
.links a.on{background:rgba(255,255,255,.08);color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:flex-end;padding:0 24px 80px;max-width:1160px;margin:0 auto}
.pixel{font-family:'Pixelify Sans',monospace;font-size:clamp(32px,5vw,54px);line-height:.95;text-transform:uppercase}
.sub{font-weight:300;color:rgba(255,255,255,.6);margin-top:14px;max-width:520px;font-size:14px}
</style>
</head>
<body>
<nav><div class="logo">LIMITLESS — HOT REALISTIC</div><div class="links"><a class="on">Hot Real</a><a href="e-dune-cold-real.html">Cold Real →</a><a href="e-dune-hot.html">Flat Hot</a></div></nav>
<canvas id="c"></canvas>
<div class="hero"><div><div class="pixel">I STUDY THE<br>SKY. I BUILD<br>THE TOOLS.</div><div class="sub">Realistic procedural — fBm warped + sun shading. No flat layers.</div></div></div>
<script>
const canvas=document.getElementById('c')
let gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl')
if(!gl){document.body.style.background='#0A0F14'}
else{
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`
const fs=`precision mediump float;
uniform vec2 r;uniform float t;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.54);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
float fbm(vec2 p){float v=0.;v+=0.5*noise(p);v+=0.25*noise(p*2.);v+=0.125*noise(p*4.);return v;}
void main(){
 vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*2.-1.;p.x*=r.x/r.y;
 vec3 sky=mix(vec3(0.05,0.09,0.13),vec3(0.12,0.16,0.2), uv.y*0.5+0.3);
 sky=mix(sky, vec3(0.85,0.55,0.28), smoothstep(0.45,0.75, uv.y)*0.85);
 float sun=smoothstep(0.02,0.0,length(uv-vec2(0.72,0.68)));sky+=vec3(1.,0.86,0.6)*sun*0.7;
 float time=t*0.03;vec2 coord=vec2(uv.x*2.8+time*0.12, uv.y);
 float h=fbm(coord*2.2)*0.5 + fbm(coord*6.)*0.14;h+=fbm(vec2(uv.x*28.,0.))*0.012;
 float mask=smoothstep(0.58,0.60, uv.y + h*0.22);
 vec3 sand=mix(vec3(0.78,0.66,0.52), vec3(0.88,0.78,0.62), smoothstep(0.2,0.6,h));
 float slope=fbm((coord+vec2(0.008,0))*2.2)-fbm((coord-vec2(0.008,0))*2.2);
 float light=0.55+0.45*max(0.,dot(normalize(vec3(-slope*4.,1.,0.)), normalize(vec3(0.6,1.,0.2))));
 sand*=light*0.9+0.4;vec3 col=mix(sky, sand, mask);col*=1.-dot(uv-0.5,uv-0.5)*0.18;
 gl_FragColor=vec4(col,1.);
}`
function sh(t,s){let o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
let v=sh(gl.VERTEX_SHADER,vs),f=sh(gl.FRAGMENT_SHADER,fs),pr=gl.createProgram()
gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr)
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pr));else{gl.useProgram(pr)
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW)
let l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,0,0,0)
let rL=gl.getUniformLocation(pr,'r'),tL=gl.getUniformLocation(pr,'t')
function rs(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',rs);rs()
let s=performance.now()
function loop(){let n=(performance.now()-s)/1000;gl.uniform2f(rL,canvas.width,canvas.height);gl.uniform1f(tL,n);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(loop)}loop()
}}
</script>
</body>
</html>
