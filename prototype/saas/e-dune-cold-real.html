<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Realistic Lunar</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&family=Pixelify+Sans:wght@400&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020610;color:#E8EEF5;overflow:hidden;font-family:'Inter',sans-serif}
body.no-webgl{background:url('e-dune-cold-poster.jpg') center/cover no-repeat}
body.no-webgl canvas{display:none}
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;width:calc(100% - 32px);max-width:1160px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;background:rgba(5,10,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);padding:10px 14px}
.links{display:flex;gap:2px;background:rgba(5,10,20,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);padding:4px}
.links a{font-family:'Geist Mono',monospace;font-size:11px;padding:8px 14px;color:rgba(255,255,255,.45)}
.links a.on{background:rgba(255,255,255,.06);color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hero{position:relative;z-index:1;min-height:100vh;display:flex;align-items:flex-end;padding:0 24px 80px;max-width:1160px;margin:0 auto}
.pixel{font-family:'Pixelify Sans',monospace;font-size:clamp(32px,5vw,54px);line-height:.95;text-transform:uppercase}
.sub{font-weight:300;color:rgba(232,238,245,.55);margin-top:14px;max-width:520px;font-size:14px}
</style>
</head>
<body>
<nav><div class="logo">LIMITLESS — COLD REALISTIC</div><div class="links"><a href="e-dune-hot-real.html">Hot Real →</a><a class="on">Cold Real</a><a href="e-dune-cold.html">Flat Cold</a></div></nav>
<canvas id="c"></canvas>
<div class="hero"><div><div class="pixel">I STUDY THE<br>SKY. I BUILD<br>THE TOOLS.</div><div class="sub">Realistic lunar — cratered regolith + earthshine + starfield.</div></div></div>
<script>
const canvas=document.getElementById('c')
let gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl')
if(!gl){document.body.classList.add('no-webgl')}
else{
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`
const fs=`precision mediump float;
uniform vec2 r;uniform float t;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.54);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
float fbm(vec2 p){float v=0.;v+=0.5*noise(p);v+=0.25*noise(p*2.);v+=0.125*noise(p*4.);return v;}
void main(){
 vec2 uv=gl_FragCoord.xy/r;
 vec3 sky=mix(vec3(0.01,0.02,0.05),vec3(0.03,0.07,0.14), pow(uv.y,0.6));
 sky+=vec3(0.15,0.22,0.35)*smoothstep(0.5,0.68,uv.y)*0.3;
 float stars=0.;for(int i=0;i<2;i++){vec2 sp=uv*vec2(70.,40.)+vec2(float(i)*17.);float h=hash(floor(sp));if(h>0.986)stars+=pow(h,8.)*(0.7+0.3*sin(t*0.8+float(i)*3.));}
 sky+=vec3(1.)*stars*0.7;
 float time=t*0.07;vec2 coord=vec2(uv.x*3.0+time*0.08, uv.y);
 vec2 qc=vec2(fbm(coord),fbm(coord+vec2(4.5,2.1)));
 float h=fbm(coord*2.0+1.5*qc)*0.5 + fbm(coord*6.)*0.12;
 float mask=smoothstep(0.60,0.62, uv.y + h*0.20);
 vec3 reg=mix(vec3(0.18,0.2,0.24), vec3(0.32,0.34,0.38), smoothstep(0.25,0.6,h));
 float slope=fbm((coord+vec2(0.008,0))*2.)-fbm((coord-vec2(0.008,0))*2.);
 float light=0.35+0.65*max(0.,dot(normalize(vec3(-slope*5.,1.,0.)), normalize(vec3(-0.6,0.9,0.2))));
 reg*=light;reg+=vec3(0.05,0.07,0.10)*(1.-light)*0.2;
 vec3 col=mix(sky, reg, mask);col*=1.-dot(uv-0.5,uv-0.5)*0.15;
 gl_FragColor=vec4(col,1.);
}`
function sh(t,s){let o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
let v=sh(gl.VERTEX_SHADER,vs),f=sh(gl.FRAGMENT_SHADER,fs),pr=gl.createProgram()
gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr)
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pr));else{gl.useProgram(pr)
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW)
let l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,0,0,0)
let rL=gl.getUniformLocation(pr,'r'),tL=gl.getUniformLocation(pr,'t')
function rs(){let d=Math.min(devicePixelRatio,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',rs);rs()
let s=performance.now()
function loop(){let n=(performance.now()-s)/1000;gl.uniform2f(rL,canvas.width,canvas.height);gl.uniform1f(tL,n);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(loop)}loop()
}}
</script>
</body>
</html>
